name: CI & Publish

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_DATABASE: gym_tracker
          MYSQL_USER: user
          MYSQL_PASSWORD: pass
          MYSQL_ROOT_PASSWORD: rootpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uuser -ppass"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install package in editable mode
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          DATABASE_URL: mysql+pymysql://user:pass@localhost:3306/gym_tracker
        run: pytest --maxfail=1 --disable-warnings -q

  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/gym-tracker-app:latest
            ghcr.io/${{ github.repository_owner }}/gym-tracker-app:${{ github.sha }}

  build-test-image:
    needs: test
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute branch image tag
        id: meta
        env:
          LC_ALL: C
        run: echo "tag=branch-$(printf '%s' "$GITHUB_REF_NAME" | sed 's/[^A-Za-z0-9._-]/-/g')" >> "$GITHUB_OUTPUT"

      - name: Build and push test image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/gym-tracker-app:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/gym-tracker-app:${{ github.sha }}

      - name: Show pullable test image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/gym-tracker-app
          BRANCH_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          echo "docker pull $IMAGE:$BRANCH_TAG" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "docker pull $IMAGE:$GITHUB_SHA" | tee -a "$GITHUB_STEP_SUMMARY"

  prune-test-images:
    needs: build-test-image
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      packages: write

    steps:
      # SHA tags alone cannot distinguish main builds from old branch builds.
      # Protect every non-test tag and every image not identifiable as ARM64-only.
      - name: Protect main image versions
        id: protected
        uses: actions/github-script@v8
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const owner = context.repo.owner;
            const organization = context.payload.repository.owner.type === 'Organization';
            core.setOutput('account', organization ? owner : 'user');
            const route = organization
              ? 'GET /orgs/{owner}/packages/container/{package}/versions'
              : 'GET /users/{owner}/packages/container/{package}/versions';
            const versions = await github.paginate(route, {
              owner, package: 'gym-tracker-app', per_page: 100
            });
            const image = `${owner.toLowerCase()}/gym-tracker-app`;
            const authorization = `Bearer ${Buffer.from(process.env.GH_TOKEN).toString('base64')}`;
            const protectedDigests = [];
            for (const version of versions) {
              const tags = version.metadata.container.tags;
              if (tags.length === 0) continue;
              if (!tags.every(tag => /^(branch-.*|[a-fA-F0-9]{40})$/.test(tag))) {
                protectedDigests.push(version.name);
                continue;
              }
              const response = await fetch(`https://ghcr.io/v2/${image}/manifests/${version.name}`, {
                headers: {
                  authorization,
                  accept: 'application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json'
                }
              });
              if (!response.ok) throw new Error(`Manifest lookup failed: ${response.status}`);
              const manifest = await response.json();
              const platforms = (manifest.manifests ?? []).map(entry => entry.platform);
              const armOnly = platforms.some(p => p?.os === 'linux' && p?.architecture === 'arm64')
                && platforms.every(p => (p?.os === 'linux' && p?.architecture === 'arm64')
                  || (p?.os === 'unknown' && p?.architecture === 'unknown'));
              if (!armOnly) protectedDigests.push(version.name);
            }
            core.setOutput('digests', protectedDigests.join(','));

      # v3 has no floating major tag. v3.1.0 protects children of retained images.
      # Remove all unreferenced untagged versions; required child manifests must
      # survive so retained main and test images remain pullable.
      - name: Prune old test image versions
        uses: snok/container-retention-policy@v3.1.0
        with:
          account: ${{ steps.protected.outputs.account }}
          token: ${{ secrets.GITHUB_TOKEN }}
          image-names: gym-tracker-app
          skip-shas: ${{ steps.protected.outputs.digests }}
          tag-selection: both
          cut-off: 0s
          timestamp-to-use: created_at
          keep-n-most-recent: 10
