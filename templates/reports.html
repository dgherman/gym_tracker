<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Gym Tracker Reports</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    /* Shrink both charts to 66% width and center */
    .chart-container {
      width: 66%;
      margin: auto;
    }
  </style>
</head>
<body class="bg-light p-4">
  {% include "_nav.html" %}

  <h1 class="mb-4">Reports</h1>

  <!-- Date-range control (shared partial) -->
  {% include "_range_control.html" %}

  <!-- Tab navigation -->
  <ul class="nav nav-tabs flex-nowrap overflow-auto mb-3" id="reportTabs" role="tablist">
    <li class="nav-item">
      <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-sessions" type="button" role="tab">Sessions</button>
    </li>
    <li class="nav-item">
      <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-billing" type="button" role="tab">Billing</button>
    </li>
    <li class="nav-item">
      <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-progress" type="button" role="tab">Progress</button>
    </li>
  </ul>

  <div class="tab-content">
    <!-- Sessions tab -->
    <div class="tab-pane fade show active" id="tab-sessions" role="tabpanel">
      <div class="mb-4">
        <h3>Total Time: <span id="totalMinutes">0</span></h3>
      </div>

      <div class="row">
        <div class="col-md-6 mb-4 chart-container">
          <h5>Minutes by Trainer</h5>
          <canvas id="trainingChart"></canvas>
        </div>

        <div class="col-md-6 mb-4 chart-container">
          <h5>Minutes by Session Duration</h5>
          <canvas id="durationChart"></canvas>
        </div>
      </div>

      <div class="row">
        <div class="col-md-6 mb-4 chart-container">
          <h5>Minutes by Training Partner</h5>
          <canvas id="partnerChart"></canvas>
        </div>
      </div>
    </div>

    <!-- Billing tab -->
    <div class="tab-pane fade" id="tab-billing" role="tabpanel">
      <div class="mb-4">
        <h3>Total Cost: <span id="totalCost">$0.00</span></h3>
      </div>

      <h5 class="mt-3">Sessions remaining</h5>
      <div class="table-responsive">
        <table class="table table-sm" id="remainingTable">
          <thead><tr><th>Package</th><th>People</th><th>Remaining</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <!-- Progress tab (filled in Task 6) -->
    <div class="tab-pane fade" id="tab-progress" role="tabpanel">
      <p class="text-muted">Progress stats coming soon.</p>
    </div>
  </div>

  <a href="/" class="btn btn-secondary mt-4">Back</a>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      initCharts();
      RangeControl.init((range) => loadReports(range));
    });

    // Chart.js instances
    let trainingChart, durationChart, partnerChart;
    function initCharts() {
      const tctx = document.getElementById('trainingChart').getContext('2d');
      trainingChart = new Chart(tctx, {
        type: 'pie',
        data: { labels: [], datasets: [{ data: [], backgroundColor: [] }] },
        options: { responsive: true }
      });

      const dctx = document.getElementById('durationChart').getContext('2d');
      durationChart = new Chart(dctx, {
        type: 'pie',
        data: { labels: [], datasets: [{ data: [], backgroundColor: [] }] },
        options: { responsive: true }
      });

      const pctx = document.getElementById('partnerChart').getContext('2d');
      partnerChart = new Chart(pctx, {
        type: 'pie',
        data: { labels: [], datasets: [{ data: [], backgroundColor: [] }] },
        options: { responsive: true }
      });
    }

    // Generate a consistent color for a given string using a hash function
    function generateTrainerColor(trainerName) {
      let hash = 0;
      for (let i = 0; i < trainerName.length; i++) {
        const char = trainerName.charCodeAt(i);
        hash = ((hash << 5) - hash) + char;
        hash = hash & hash;
      }
      const hue = Math.abs(hash) % 360;
      const saturation = 65 + (Math.abs(hash) % 25);
      const lightness = 45 + (Math.abs(hash) % 15);
      return `hsl(${hue}, ${saturation}%, ${lightness}%)`;
    }

    // Format minutes to "X hour(s) and Y minute(s)"
    function formatHoursMinutes(totalMinutes) {
      const hrs = Math.floor(totalMinutes / 60);
      const mins = totalMinutes % 60;
      const parts = [];
      if (hrs > 0) parts.push(`${hrs} hour${hrs === 1 ? '' : 's'}`);
      if (mins > 0) parts.push(`${mins} minute${mins === 1 ? '' : 's'}`);
      if (parts.length === 0) return '0 minutes';
      return parts.join(' and ');
    }

    // Fetch & render sessions + billing
    async function loadReports(range) {
      const { start, end } = range;
      const res = await fetch(
        `/reports/data?start=${encodeURIComponent(start)}&end=${encodeURIComponent(end)}`
      );
      const data = await res.json();
      const {
        training,
        total_cost,
        total_minutes_by_duration,
        minutes_by_partner,
        sessions_remaining,
      } = data;

      // Total cost
      document.getElementById('totalCost').textContent = `$${total_cost.toFixed(2)}`;

      // Compute overall total minutes
      const totalMinutes = total_minutes_by_duration
        .reduce((sum, item) => sum + item.minutes, 0);
      document.getElementById('totalMinutes').textContent =
        formatHoursMinutes(totalMinutes);

      // Minutes by Trainer chart
      const trainerLabels = training.map(r => r.trainer);
      const trainerData   = training.map(r => r.minutes);
      const trainerColors = trainerLabels.map(name => generateTrainerColor(name));
      trainingChart.data.labels = trainerLabels;
      trainingChart.data.datasets[0].data = trainerData;
      trainingChart.data.datasets[0].backgroundColor = trainerColors;
      trainingChart.update();

      // Minutes by Session Duration chart
      const durLabels = total_minutes_by_duration.map(d => `${d.duration}-min`);
      const durData   = total_minutes_by_duration.map(d => d.minutes);
      const durColors = ['#28a745', '#ffc107'].slice(0, durLabels.length);
      durationChart.data.labels = durLabels;
      durationChart.data.datasets[0].data = durData;
      durationChart.data.datasets[0].backgroundColor = durColors;
      durationChart.update();

      // Minutes by Partner chart
      const partnerLabels = (minutes_by_partner || []).map(p => p.partner);
      const partnerData   = (minutes_by_partner || []).map(p => p.minutes);
      const partnerColors = partnerLabels.map(name =>
        name === 'Solo' ? '#6c757d' : generateTrainerColor(name)
      );
      partnerChart.data.labels = partnerLabels;
      partnerChart.data.datasets[0].data = partnerData;
      partnerChart.data.datasets[0].backgroundColor = partnerColors;
      partnerChart.update();

      // Sessions remaining table
      document.querySelector('#remainingTable tbody').innerHTML =
        (sessions_remaining || []).map(p =>
          `<tr><td>${p.duration} min</td><td>${p.num_people}</td><td>${p.remaining}</td></tr>`
        ).join('');
    }
  </script>
</body>
</html>
