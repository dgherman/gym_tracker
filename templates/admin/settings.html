<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings - Admin - Gym Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  {% include "_nav.html" %}

  <div class="container py-4" style="max-width:700px">
    <h2 class="mb-4">Admin Settings</h2>

    <div class="card mb-3">
      <div class="card-body">
        <h5 class="card-title">Session Auto-Complete</h5>
        <p class="card-text text-muted">When enabled, scheduled sessions whose date/time has passed are automatically marked as completed when the calendar loads.</p>
        <div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" role="switch"
                 id="autoCompleteToggle"
                 {% if auto_complete_sessions %}checked{% endif %}>
          <label class="form-check-label" for="autoCompleteToggle">
            Auto mark past scheduled sessions as completed
          </label>
        </div>
        <div id="autoCompleteStatus" class="mt-2 text-muted small"></div>
      </div>
    </div>

    <a href="/admin" class="btn btn-outline-secondary">← Back to Admin Console</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById('autoCompleteToggle').addEventListener('change', async function () {
      const value = this.checked ? 'true' : 'false';
      const statusEl = document.getElementById('autoCompleteStatus');
      statusEl.textContent = 'Saving…';
      try {
        const res = await fetch('/api/admin/settings', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ key: 'auto_complete_sessions', value }),
        });
        if (res.ok) {
          statusEl.textContent = 'Saved.';
          setTimeout(() => { statusEl.textContent = ''; }, 2000);
        } else {
          statusEl.textContent = 'Error saving. Please try again.';
          this.checked = !this.checked;
        }
      } catch (e) {
        statusEl.textContent = 'Network error.';
        this.checked = !this.checked;
      }
    });
  </script>
</body>
</html>
