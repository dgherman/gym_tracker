<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Gym Tracker History</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    .action-btn { min-width: 3.5rem; text-align: center; }
  </style>
</head>
<body class="bg-light p-4">
  {% include "_nav.html" %}
  <a href="/" class="btn btn-secondary mt-3 mb-3">Home</a>
  <h1 class="mb-4">History</h1>

  <!-- Date-range control (shared partial) -->
  {% include "_range_control.html" %}

  <div id="history-content"></div>

  <!-- Edit Session Modal -->
  <div class="modal fade" id="editSessionModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <form id="editSessionForm" onsubmit="submitSessionEdit(event)">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Edit Session</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="sessionId"/>
            <div class="mb-3">
              <label class="form-label">Date &amp; Time</label>
              <input type="datetime-local" id="sessionDate" class="form-control" required/>
            </div>
            <div class="mb-3">
              <label class="form-label">Duration</label>
              <select id="sessionDuration" class="form-select">
                <option value="30">30 min</option>
                <option value="45">45 min</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Trainer</label>
              <select id="sessionTrainer" class="form-select">
                <!-- Options will be populated dynamically -->
              </select>
            </div>
            {% include "_activity_section.html" %}
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-primary">Save</button>
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    window.CURRENT_USER_NAME = {{ ((current_user.full_name or current_user.email) if current_user else 'You') | tojson }};
  </script>
  <script>
    // Helpers
    function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
    function pad(n) { return n.toString().padStart(2,'0'); }
    let sessionsById = {};

    // Load trainers from API
    async function loadTrainers() {
      try {
        const res = await fetch('/api/trainers/');
        const trainers = await res.json();
        const select = document.getElementById('sessionTrainer');
        select.innerHTML = trainers
          .map(trainer => `<option value="${trainer.name}">${trainer.name}</option>`)
          .join('');
      } catch (err) {
        console.error("loadTrainers error:", err);
        document.getElementById('sessionTrainer').innerHTML =
          '<option disabled>Error loading trainers</option>';
      }
    }

    function parseUTC(s) {
      // Parse as UTC
      return new Date(s + 'Z');
    }

    function formatNoSeconds(dt) {
      return dt.toLocaleString(undefined, {
        month: 'short', day: 'numeric', year: 'numeric',
        hour: 'numeric', minute: '2-digit'
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadTrainers();
      ActivitySection.load().then(() => ActivitySection.init());
      RangeControl.init((range) => loadHistory(range));
    });

    // Alerts
    function showAlert(msg, type='info') {
      const html = `<div class="alert alert-${type} alert-dismissible fade show" role="alert">
        ${msg}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>`;
      document.getElementById('history-content').insertAdjacentHTML('afterbegin', html);
    }

    // Load & render
    async function loadHistory(range) {
      const { start, end } = range;
      const [sRes, pRes] = await Promise.all([
        fetch(`/history/sessions/?start=${encodeURIComponent(start)}&end=${encodeURIComponent(end)}`),
        fetch(`/history/purchases/?start=${encodeURIComponent(start)}&end=${encodeURIComponent(end)}`)
      ]);
      const sessions  = await sRes.json();
      sessionsById = {};
      sessions.forEach(s => { sessionsById[s.id] = s; });
      const purchases = await pRes.json();

      // Sessions
      let html = '<h2>Sessions</h2><ul class="list-group mb-4">';
      if (sessions.length) {
        sessions.forEach(s => {
          const local = parseUTC(s.session_date);
          const label = formatNoSeconds(local);
          // Build local iso for picker
          const dtLocal =
            local.getFullYear() + '-' +
            pad(local.getMonth()+1) + '-' +
            pad(local.getDate()) + 'T' +
            pad(local.getHours()) + ':' +
            pad(local.getMinutes());

          let partnerBadge = '';
          if (s.num_people >= 2 && s.partner_name) {
            partnerBadge = ` <span class="badge bg-info">with ${escapeHtml(s.partner_name)}</span>`;
          }
          if (!s.is_owner) {
            partnerBadge += ' <span class="badge bg-secondary">Shared</span>';
          }

          const canEdit = s.can_edit !== false;

          let actHtml = '';
          if (s.activities && s.activities.length) {
            const fmap = ActivitySection.fieldMap();
            function renderActivityLine(a) {
              const parts = Object.entries(a.values || {}).map(([k, v]) => {
                const f = fmap[a.category_id + ':' + k];
                const label = f ? f.label : k;
                const disp = f ? ActivitySection.fmtValue(a.category_name, f, v) : v;
                return `${escapeHtml(label)}: ${escapeHtml(disp)}`;
              }).join(' · ');
              const note = a.notes ? ` <span class="text-muted">· ${escapeHtml(a.notes)}</span>` : '';
              return `<div class="small">• ${escapeHtml(a.activity_name)} <span class="text-muted">${parts}</span>${note}</div>`;
            }
            // Category header + activity lines, same style for solo and couples
            function renderByCategory(items) {
              const byCat = {};
              items.forEach(a => { (byCat[a.category_name] = byCat[a.category_name] || []).push(a); });
              return Object.entries(byCat).map(([cat, rows]) =>
                `<div class="small text-uppercase text-muted">${escapeHtml(cat)}</div>` +
                rows.map(renderActivityLine).join('')
              ).join('');
            }
            if (s.num_people > 1) {
              // Couples session: group by person_name, then by category
              const byPerson = {};
              const personOrder = [];
              s.activities.forEach(a => {
                const pname = a.person_name || 'Both / Shared';
                if (!byPerson[pname]) { byPerson[pname] = []; personOrder.push(pname); }
                byPerson[pname].push(a);
              });
              actHtml = '<div class="ms-3 mt-1 w-100">' +
                personOrder.map(pname =>
                  `<div class="small fw-bold text-dark mt-1">${escapeHtml(pname)}</div>` +
                  `<div class="ms-2">${renderByCategory(byPerson[pname])}</div>`
                ).join('') + '</div>';
            } else {
              actHtml = '<div class="ms-3 mt-1 w-100">' + renderByCategory(s.activities) + '</div>';
            }
          }

          html += `
            <li class="list-group-item small" id="session-card-${s.id}">
              <div class="d-flex justify-content-between align-items-center">
                <span class="flex-grow-1 text-wrap">
                  ${label} — ${s.duration_minutes} min with ${escapeHtml(s.trainer)}${partnerBadge}
                </span>
                <span class="d-flex gap-1">
                  ${canEdit ? `
                  <button class="btn btn-sm btn-outline-primary action-btn py-0 px-2"
                          data-bs-toggle="modal" data-bs-target="#editSessionModal"
                          data-id="${s.id}"
                          data-date="${dtLocal}"
                          data-duration="${s.duration_minutes}"
                          data-trainer="${escapeHtml(s.trainer)}">
                    Edit
                  </button>
                  <button class="btn btn-sm btn-outline-danger action-btn py-0 px-2"
                          onclick="confirmDelete('session', ${s.id})">Delete</button>
                  ` : ''}
                </span>
              </div>
              ${actHtml}
            </li>`;
        });
      } else {
        html += '<li class="list-group-item small text-muted">No sessions for this range.</li>';
      }
      html += '</ul>';

      // Purchases
      html += '<h2>Purchases</h2><ul class="list-group">';
      if (purchases.length) {
        purchases.forEach(p => {
          const local = parseUTC(p.purchase_date);
          const label = formatNoSeconds(local);

          let partnerBadge = '';
          if (p.num_people >= 2 && p.partner_name) {
            partnerBadge = ` <span class="badge bg-info">Partner: ${escapeHtml(p.partner_name)}</span>`;
          }

          let costLabel = '';
          if (p.is_owner === false) {
            costLabel = ' <span class="badge bg-secondary">Shared with you</span>';
          } else if (p.cost > 0) {
            costLabel = ` <small class="text-muted">$${p.cost.toFixed(2)}</small>`;
          }

          const canDelete = p.is_owner !== false;

          html += `
            <li class="list-group-item d-flex justify-content-between align-items-center small" id="purchase-card-${p.id}">
              <span class="flex-grow-1 text-wrap">
                ${label} — ${p.duration_minutes}-min ${p.total_sessions} sessions pack <small>(${p.sessions_remaining} left)</small>${partnerBadge}${costLabel}
              </span>
              <span>
                ${canDelete ? `
                <button class="btn btn-sm btn-outline-danger action-btn py-0 px-2"
                        onclick="confirmDelete('purchase', ${p.id})">
                  Delete
                </button>
                ` : ''}
              </span>
            </li>`;
        });
      } else {
        html += '<li class="list-group-item small text-muted">No purchases for this range.</li>';
      }
      html += '</ul>';

      document.getElementById('history-content').innerHTML = html;
    }

    // Delete
    function confirmDelete(type, id) {
      if (!confirm(`Are you sure you want to delete this ${type}?`)) return;
      const url = type === 'session'
        ? `/history/api/delete/session/${id}`
        : `/history/api/delete/purchase/${id}`;
      fetch(url, { method:'POST' })
        .then(r=>r.json()).then(d=>{
          if (d.success) {
            showAlert(`${type.charAt(0).toUpperCase()+type.slice(1)} deleted.`, 'warning');
            setTimeout(() => loadHistory(RangeControl.getRange()), 1500);
          } else {
            showAlert(`Failed to delete ${type}.`, 'danger');
          }
        });
    }

    // Edit Session
    document.getElementById('editSessionModal')
      .addEventListener('show.bs.modal', async e => {
        const btn = e.relatedTarget;
        document.getElementById('sessionId').value       = btn.dataset.id;
        document.getElementById('sessionDate').value     = btn.dataset.date;
        document.getElementById('sessionDuration').value = btn.dataset.duration;

        // Ensure trainers are loaded before setting the value
        await loadTrainers();
        document.getElementById('sessionTrainer').value  = btn.dataset.trainer;

        const sess = sessionsById[btn.dataset.id];
        ActivitySection.setPeople(sess && sess.num_people > 1 ? {
          numPeople: sess.num_people,
          personA: (window.CURRENT_USER_NAME || 'You'),
          personB: (sess.partner_name || 'Partner'),
        } : { numPeople: 1 });
        ActivitySection.prefill(sess ? sess.activities : []);
      });

    function submitSessionEdit(evt) {
      evt.preventDefault();
      const id = document.getElementById('sessionId').value;
      const payload = {
        session_date:     document.getElementById('sessionDate').value,
        duration_minutes: +document.getElementById('sessionDuration').value,
        trainer:          document.getElementById('sessionTrainer').value,
        activities:       ActivitySection.collect()
      };
      fetch(`/history/api/edit/session/${id}`, {
        method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)
      })
        .then(r=>r.json()).then(d=>{
          if (d.success) {
            showAlert('Session updated.', 'success');
            bootstrap.Modal.getInstance(document.getElementById('editSessionModal')).hide();
            setTimeout(() => loadHistory(RangeControl.getRange()), 1500);
          } else {
            showAlert('Failed to update session.', 'danger');
          }
        });
    }
  </script>
</body>
</html>
