<!-- Reusable optional activity logging section. Include once per page. -->
<div class="border rounded mt-3" id="activitySection">
  <button type="button" class="btn btn-link text-decoration-none w-100 text-start fw-bold"
          data-bs-toggle="collapse" data-bs-target="#actSectionBody">
    Log activities <span class="text-muted fw-normal">(optional)</span>
  </button>
  <div class="collapse" id="actSectionBody">
    <div class="p-2">
      <div id="actList"></div>

      <div class="border-top pt-2">
        <div class="row g-2">
          <div class="col-12">
            <select id="actCategory" class="form-select form-select-sm">
              <option value="">-- Category --</option>
            </select>
          </div>
          <div class="col-12">
            <input id="actActivity" list="actActivityList" class="form-control form-control-sm"
                   placeholder="Activity (type to search or add new)">
            <datalist id="actActivityList"></datalist>
          </div>
          <div class="col-12" id="actFields"></div>
          <div class="col-12">
            <input id="actNote" class="form-control form-control-sm" placeholder="Note (optional)">
          </div>
          <div class="col-12" id="actAddBtns">
            <button type="button" id="actAddBtn" class="btn btn-sm btn-outline-success">+ Add to session</button>
            <button type="button" id="actAddBtnB" class="btn btn-sm btn-outline-primary d-none">+ Add to Person B</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const ActivitySection = (function () {
  let categories = [];          // [{id,name,fields:[{key,label,field_type,unit,is_required}]}]
  let activitiesByCat = {};     // catId -> [{id,name}]
  let rows = [];                // pending {id?, category_id, activity_id, activity_name, category_name, values, notes, person_slot}
  let editingIndex = null;      // index of the row currently being edited, or null
  let people = { numPeople: 1, personA: 'Person A', personB: 'Person B' };

  function setPeople(p) {
    people = Object.assign({ numPeople: 1, personA: 'Person A', personB: 'Person B' }, p || {});
    renderAddButtons();
    renderRows();
  }

  function fieldMap() {
    const m = {};
    categories.forEach(c => c.fields.forEach(f => { m[c.id + ':' + f.key] = f; }));
    return m;
  }

  function fmtValue(catName, f, val) {
    if (f.field_type === 'duration') {
      // Duration is entered and stored as whole minutes.
      return val + ' ' + (f.unit || 'min');
    }
    return val + (f.unit ? ' ' + f.unit : '');
  }

  async function load() {
    const res = await fetch('/api/categories', { headers: { accept: 'application/json' } });
    categories = await res.json();
    const sel = document.getElementById('actCategory');
    if (sel) {
      sel.innerHTML = '<option value="">-- Category --</option>' +
        categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
    }
  }

  async function loadActivities(catId) {
    if (!activitiesByCat[catId]) {
      const res = await fetch('/api/activities?category_id=' + catId, { headers: { accept: 'application/json' } });
      activitiesByCat[catId] = await res.json();
    }
    const dl = document.getElementById('actActivityList');
    dl.innerHTML = activitiesByCat[catId].map(a => `<option value="${escapeHtml(a.name)}">`).join('');
  }

  function renderFields(catId) {
    const cat = categories.find(c => c.id == catId);
    const wrap = document.getElementById('actFields');
    if (!cat) { wrap.innerHTML = ''; return; }
    wrap.innerHTML = '<div class="row g-1">' + cat.fields.map(f => `
      <div class="col">
        <input class="form-control form-control-sm act-field" data-key="${f.key}"
               data-type="${f.field_type}"
               placeholder="${f.label}${f.unit ? ' (' + f.unit + ')' : ''}${f.is_required ? ' *' : ''}">
      </div>`).join('') + '</div>';
  }

  function renderAddButtons() {
    const a = document.getElementById('actAddBtn');
    const b = document.getElementById('actAddBtnB');
    if (!a || !b) return;
    if (people.numPeople > 1) {
      a.textContent = (editingIndex !== null ? 'Save for ' : '+ Add to ') + escapeHtml(people.personA);
      b.textContent = (editingIndex !== null ? 'Save for ' : '+ Add to ') + escapeHtml(people.personB);
      b.classList.remove('d-none');
    } else {
      a.textContent = (editingIndex !== null ? 'Save changes' : '+ Add to session');
      b.classList.add('d-none');
    }
  }

  function rowHtml(r, i) {
    const fmap = fieldMap();
    const parts = Object.entries(r.values).map(([k, v]) => {
      const f = fmap[r.category_id + ':' + k];
      const label = f ? f.label : k;
      const disp = f ? fmtValue(r.category_name, f, v) : v;
      return `${escapeHtml(label)}: ${escapeHtml(disp)}`;
    }).join(' · ');
    const note = r.notes ? ` <span class="text-muted">· ${escapeHtml(r.notes)}</span>` : '';
    const editing = (editingIndex === i) ? ' bg-warning-subtle' : '';
    return `<li class="list-group-item d-flex justify-content-between align-items-center py-1 small${editing}">
      <span><strong>${escapeHtml(r.activity_name)}</strong> <span class="text-muted">· ${escapeHtml(r.category_name)}</span> ${parts}${note}</span>
      <span class="d-flex gap-2">
        <button type="button" class="btn btn-sm btn-link p-0" onclick="ActivitySection.edit(${i})">Edit</button>
        <button type="button" class="btn btn-sm btn-link text-danger p-0" onclick="ActivitySection.remove(${i})">✕</button>
      </span></li>`;
  }

  function group(label, indices) {
    if (!indices.length) return '';
    return `<div class="fw-bold small mt-2">${escapeHtml(label)}</div>` +
      `<ul class="list-group mb-1">${indices.map(i => rowHtml(rows[i], i)).join('')}</ul>`;
  }

  function renderRows() {
    const ul = document.getElementById('actList');
    if (people.numPeople <= 1) {
      ul.innerHTML = rows.length ? `<ul class="list-group">${rows.map((r, i) => rowHtml(r, i)).join('')}</ul>` : '';
      return;
    }
    const idx = (s) => rows.map((r, i) => [r, i]).filter(([r]) => (r.person_slot ?? null) === s).map(([, i]) => i);
    ul.innerHTML =
      group(people.personA, idx(1)) +
      group(people.personB, idx(2)) +
      group('Both / Shared', idx(null));
  }

  async function ensureActivity(catId, name) {
    const list = activitiesByCat[catId] || [];
    const found = list.find(a => a.name.toLowerCase() === name.toLowerCase());
    if (found) return found;
    const res = await fetch('/api/activities', {
      method: 'POST', headers: { 'Content-Type': 'application/json', accept: 'application/json' },
      body: JSON.stringify({ category_id: parseInt(catId), name })
    });
    if (!res.ok) { alert('Could not create activity'); return null; }
    const created = await res.json();
    activitiesByCat[catId] = list.concat([created]);
    return created;
  }

  async function add(slot) {
    const catSel = document.getElementById('actCategory');
    const catId = catSel.value;
    const name = document.getElementById('actActivity').value.trim();
    if (!catId || !name) { alert('Pick a category and activity'); return; }
    const cat = categories.find(c => c.id == catId);

    const values = {};
    let missingRequired = null;
    document.querySelectorAll('#actFields .act-field').forEach(inp => {
      const v = inp.value.trim();
      const f = cat.fields.find(x => x.key === inp.dataset.key);
      if (v !== '') values[inp.dataset.key] = v;
      else if (f && f.is_required) missingRequired = f.label;
    });
    if (missingRequired) { alert(`"${missingRequired}" is required`); return; }

    const activity = await ensureActivity(catId, name);
    if (!activity) return;

    let resolvedSlot = slot;
    if (editingIndex !== null && rows[editingIndex] && slot == null) {
      resolvedSlot = rows[editingIndex].person_slot;
    }
    const row = {
      id: (editingIndex !== null && rows[editingIndex]) ? rows[editingIndex].id : undefined,
      category_id: cat.id,
      activity_id: activity.id,
      activity_name: activity.name,
      category_name: cat.name,
      values,
      notes: document.getElementById('actNote').value.trim() || null,
      person_slot: people.numPeople > 1 ? (resolvedSlot != null ? resolvedSlot : 1) : null,
    };
    if (editingIndex !== null) {
      rows[editingIndex] = row;     // update in place, preserving its id
    } else {
      rows.push(row);
    }
    clearForm();
    renderRows();
  }

  // Load a row back into the form for editing.
  function edit(i) {
    const r = rows[i];
    if (!r) return;
    editingIndex = i;
    const catSel = document.getElementById('actCategory');
    catSel.value = r.category_id;
    renderFields(r.category_id);
    loadActivities(r.category_id);
    document.getElementById('actActivity').value = r.activity_name;
    document.getElementById('actNote').value = r.notes || '';
    document.querySelectorAll('#actFields .act-field').forEach(inp => {
      inp.value = (r.values && r.values[inp.dataset.key] != null) ? r.values[inp.dataset.key] : '';
    });
    renderAddButtons();  // update button labels to "Save for ..." mode
    renderRows();  // highlight the row being edited
  }

  // Clear the input area and exit edit mode.
  function clearForm() {
    editingIndex = null;
    document.getElementById('actActivity').value = '';
    document.getElementById('actNote').value = '';
    document.querySelectorAll('#actFields .act-field').forEach(i => i.value = '');
    renderAddButtons();  // reset button labels back to "+ Add to ..."
  }

  function remove(i) {
    rows.splice(i, 1);
    if (editingIndex !== null) clearForm();  // cancel any in-progress edit (indices shifted)
    renderRows();
  }

  function collect() {
    return rows.map(r => ({
      id: r.id || undefined,
      activity_id: r.activity_id,
      values: r.values,
      notes: r.notes,
      person_slot: r.person_slot ?? null,
    }));
  }

  function reset() { rows = []; clearForm(); renderRows(); }

  function prefill(serverRows) {
    // serverRows from /history/sessions/ : {id, activity_id, activity_name, category_id, category_name, values, notes, person_slot}
    rows = (serverRows || []).map(r => ({
      id: r.id,
      category_id: r.category_id,
      activity_id: r.activity_id,
      activity_name: r.activity_name,
      category_name: r.category_name,
      values: r.values || {},
      notes: r.notes || null,
      person_slot: r.person_slot ?? null,
    }));
    clearForm();
    renderRows();
  }

  function init() {
    const catSel = document.getElementById('actCategory');
    if (!catSel) return;
    catSel.addEventListener('change', async (e) => {
      const id = e.target.value;
      renderFields(id);
      if (id) await loadActivities(id);
    });
    document.getElementById('actAddBtn').addEventListener('click', () => add(1));
    const bBtn = document.getElementById('actAddBtnB');
    if (bBtn) bBtn.addEventListener('click', () => add(2));
  }

  return { load, init, add, edit, remove, collect, reset, prefill, setPeople, fieldMap, fmtValue };
})();
</script>
